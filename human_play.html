<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>三麻人类自玩面板（自动续局）</title>
  <style>
    :root {
      --bg: #e4e9f3;         /* 略深的浅色背景 */
      --panel: #f7f9fc;      /* 卡片浅色 */
      --accent: #2563eb;
      --text: #0b1220;       /* 深色正文 */
      --muted: #2f3a4c;      /* 比之前更深的辅色文字 */
      --danger: #b91c1c;
      --success: #16a34a;
      --border: #cfd6e4;     /* 稍深的边框 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 { margin: 0 0 8px; }
    .grid { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: 0 12px 30px rgba(15,23,42,0.06); }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 600; color: var(--text); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button { background: #e2e8f6; color: var(--text); border: 1px solid #c8d3ec; border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: all 0.15s ease; font-weight: 600; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 8px; background: #e8edfa; font-size: 12px; color: var(--text); border: 1px solid var(--border); }
    .tiles { display: flex; flex-wrap: wrap; gap: 0px; }
    .tile { padding: 0; border-radius: 6px; min-width: 48px; height: 64px; text-align: center; background: #f5f7fb; border: 1px solid var(--border); cursor: pointer; user-select: none; transition: transform 0.12s ease, border 0.12s ease; font-weight: 700; letter-spacing: 0.5px; background-size: contain; background-repeat: no-repeat; background-position: center; display: flex; align-items: center; justify-content: center; }
    .tile.m { color: #f97316; }
    .tile.p { color: #22d3ee; }
    .tile.s { color: #4ade80; }
    .tile.z { color: #eab308; }
    .tile.red { color: #f43f5e; }
    .tile.selected { border-color: var(--accent); transform: translateY(-2px); }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat { background: #eef2f7; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .stat label { font-size: 12px; color: var(--muted); }
    .stat .val { font-size: 18px; font-weight: 700; color: var(--text); }
    textarea { width: 100%; min-height: 120px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px; font-family: monospace; }
    ul { list-style: none; padding: 0; margin: 0; }
    li.history-item { border-bottom: 1px solid var(--border); padding: 6px 0; font-size: 13px; color: var(--text); }
    .meta { color: #1f2937; font-size: 12px; }
    .danger { background: #fee2e2; border: 1px solid #fecdd3; color: #b91c1c; }
    .danger:hover { border-color: #ef4444; color: #b91c1c; }
  </style>
</head>
<body>
  <h1>三麻人类自玩面板（自动续局，规则对齐工程）</h1>
  <div class="grid">
    <div class="card">
      <div class="section-title">
        <span>当前对局（不可手动新开，系统自动续局）</span>
        <div class="badge" id="statusLabel">准备中</div>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <button id="discardBtn">打出选中</button>
        <label style="display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="autoDiscardToggle" />
          <span class="badge">点牌即打出</span>
        </label>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <div class="badge">剩余摸牌: <span id="drawsLeft">-</span></div>
        <div class="badge">牌山剩余: <span id="wallLeft">-</span></div>
        <div class="badge">已进行巡目: <span id="stepCount">0</span></div>
      </div>
      <div class="section-title">
        <span>手牌（14 张时才能打出）</span>
        <button id="sortBtn" style="padding:4px 8px;">整理</button>
      </div>
      <div id="hand" class="tiles"></div>
      <div class="section-title" style="margin-top:10px;">弃牌</div>
      <div id="discards" class="tiles"></div>
    </div>

    <div class="card">
      <div class="section-title">统计（TensorBoard 指标）</div>
      <div class="stat-grid">
        <div class="stat"><label>总局数</label><div class="val" id="gamesVal">0</div></div>
        <div class="stat"><label>平均奖励</label><div class="val" id="avgRewardVal">0.0000</div></div>
        <div class="stat"><label>平均和牌巡目</label><div class="val" id="avgWinRoundsVal">—</div></div>
        <div class="stat"><label>胜率</label><div class="val" id="winRatioVal">0.00%</div></div>
        <div class="stat"><label>听牌率</label><div class="val" id="tenpaiRatioVal">0.00%</div></div>
        <div class="stat"><label>其他占比</label><div class="val" id="otherRatioVal">0.00%</div></div>
        <div class="stat"><label>胜型占比</label><div class="val" id="winTypesVal">—</div></div>
        <div class="stat"><label>听牌型占比</label><div class="val" id="tenpaiTypesVal">—</div></div>
      </div>
      <div class="section-title" style="margin-top:12px;">导入/导出/清空</div>
      <div class="row" style="margin-bottom:8px;">
        <button id="exportBtn">导出 JSON</button>
        <button id="importBtn">导入 JSON</button>
        <button class="danger" id="clearBtn">清空记录</button>
      </div>
      <textarea id="ioArea" placeholder="导出后粘贴，或粘贴要导入的 JSON"></textarea>
    </div>

    <div class="card">
      <div class="section-title">历史（最新在前）</div>
      <ul id="historyList"></ul>
    </div>
  </div>

    // --- 常量与工具，保持与工程一致 ---
    const STORAGE_KEY = "mahjong_human_stats_v3";
    const STORAGE_GAME_KEY = "mahjong_human_game_v1";
    const MAX_DRAWS = 18;
    const BASE_TILES = [
      "1m","9m",
      "1p","2p","3p","4p","5p","6p","7p","8p","9p",
      "1s","2s","3s","4s","5s","6s","7s","8s","9s",
      "1z","2z","3z","4z","5z","6z","7z",
    ];
    const REDS = ["0p","0s"];
    const OUTPUT_TILES = BASE_TILES.concat(REDS);
    const SUIT_ORDER = ["m","p","s","z"];
    const VALUE_ORDER = [1,2,3,4,0,5,6,7,8,9]; // 红5 视作 0 排在 4 后

    function buildWall(){
      const wall = [];
      // m: 1,9 各4
      ["1m","9m"].forEach(t=>{for(let i=0;i<4;i++) wall.push(t);});
      // p,s: 1-9 四张；5 有 3 张 + 1 红
      ["p","s"].forEach(suit=>{
        for(let v=1; v<=9; v++){
          const copies = v===5 ? 3 : 4;
          for(let i=0;i<copies;i++) wall.push(`${v}${suit}`);
        }
        wall.push(`0${suit}`);
      });
      // z: 1-7 各4
      for(let v=1; v<=7; v++) for(let i=0;i<4;i++) wall.push(`${v}z`);
      // shuffle
      for(let i=wall.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [wall[i],wall[j]]=[wall[j],wall[i]];
      }
      return wall;
    }

    function tileSortKey(t){
      const suit=t.slice(-1);
      const vRaw=t[0]==="0"?0:parseInt(t[0],10);
      const sIdx=SUIT_ORDER.indexOf(suit);
      const vIdx=VALUE_ORDER.indexOf(vRaw);
      return sIdx*100+vIdx;
    }
    function sortHand(hand){ hand.sort((a,b)=>tileSortKey(a)-tileSortKey(b)); }

    function counts34(hand){
      // map: m:0-8, p:9-17, s:18-26, z:27-33
      const idx = (t)=>{
        const suit=t.slice(-1);
        if(suit==="z") return 27 + (parseInt(t[0],10)-1);
        const v = t[0]==="0"?5:parseInt(t[0],10);
        const base = suit==="m"?0:suit==="p"?9:18;
        return base + (v-1);
      };
      const c=new Array(34).fill(0);
      hand.forEach(t=>c[idx(t)]++);
      return c;
    }

    function removeTriple(cnt,i){ if(cnt[i]>=3){cnt[i]-=3; return true;} return false; }
    function removeSeq(cnt,i){
      const suit=Math.floor(i/9);
      const pos=i%9;
      if(suit>=3 || pos>6) return false;
      if(cnt[i]>0 && cnt[i+1]>0 && cnt[i+2]>0){cnt[i]--;cnt[i+1]--;cnt[i+2]--;return true;}
      return false;
    }
    function canFormMelds(cnt){
      const find=()=>cnt.findIndex(x=>x>0);
      function dfs(){
        const i=find(); if(i===-1) return true;
        if(removeTriple(cnt,i)){ if(dfs()) return true; cnt[i]+=3; }
        if(removeSeq(cnt,i)){ if(dfs()) return true; cnt[i]++;cnt[i+1]++;cnt[i+2]++; }
        return false;
      }
      return dfs();
    }
    function isStandard(hand){
      if(hand.length!==14) return false;
      const cnt=counts34(hand);
      for(let i=0;i<cnt.length;i++){
        if(cnt[i]>=2){
          cnt[i]-=2;
          if(canFormMelds(cnt)) return true;
          cnt[i]+=2;
        }
      }
      return false;
    }
    function isSevenPairs(hand){
      if(hand.length!==14) return false;
      const cnt=counts34(hand);
      return cnt.every(x=>x===0||x===2);
    }
    function isKokushi(hand){
      const kok = ["1m","9m","1p","9p","1s","9s","1z","2z","3z","4z","5z","6z","7z"];
      const seen=new Set(); let pair=false;
      for(const t of hand){
        const norm = t[0]==="0" ? `5${t[1]}` : t;
        if(!kok.includes(norm)) return false;
        if(seen.has(norm)) pair=true;
        seen.add(norm);
      }
      return seen.size===kok.length && pair;
    }
    function canWin(hand){ return isStandard(hand)||isSevenPairs(hand)||isKokushi(hand); }
    function classifyWinType(hand){
      if(isKokushi(hand)) return "kokushi";
      if(isSevenPairs(hand)) return "seven_pairs";
      if(isStandard(hand)) return "standard";
      return "other";
    }
    function isTenpai(hand13){
      if(hand13.length!==13) return false;
      for(const t of OUTPUT_TILES){
        const next = hand13.concat([t]);
        if(canWin(next)) return true;
      }
      return false;
    }

    // --- 状态 ---
    let state = {
      wall: [],
      hand: [],
      discards: [],
      drawsLeft: MAX_DRAWS,
      stepCount: 0,
      inGame: false,
    };
    let currentSteps = [];

    let stats = {
      games: 0, wins: 0, tenpais: 0, others: 0,
      reward_sum: 0, win_round_sum: 0,
      win_type: { standard: 0, seven_pairs: 0, kokushi: 0 },
      tenpai_type: { standard: 0, seven_pairs: 0, kokushi: 0 },
      history: [],
    };

    // --- 存储 ---
    function loadState(){
      const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return;
      try{ const obj=JSON.parse(raw); stats={...stats,...obj}; }catch(e){console.warn("读取统计存储失败",e);}
    }
    function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); }

    function loadGameState(){
      const raw=localStorage.getItem(STORAGE_GAME_KEY); if(!raw) return false;
      try{
        const obj=JSON.parse(raw);
        if(!obj || !Array.isArray(obj.wall) || !Array.isArray(obj.hand) || typeof obj.drawsLeft!=="number") return false;
        state = { ...state, ...obj };
        currentSteps = obj.currentSteps || [];
        autoDiscard = !!obj.autoDiscard;
        document.getElementById("autoDiscardToggle").checked = autoDiscard;
        return !!state.inGame;
      }catch(e){
        console.warn("读取对局存储失败",e);
        return false;
      }
    }
    function saveGameState(){
      const obj = { ...state, currentSteps, autoDiscard };
      localStorage.setItem(STORAGE_GAME_KEY, JSON.stringify(obj));
    }

    // --- UI ---
    let selectedIdx=null;
    function renderTiles(container, tiles, selectable=false){
      container.innerHTML="";
      tiles.forEach((t,idx)=>{
        const suit = t.slice(-1);
        const div=document.createElement("div");
        div.className=`tile ${suit==="z"?"z":suit} ${t[0]==="0"?"red":""}`;
        if (TILE_IMAGES[t]) {
          div.style.backgroundImage = `url(${TILE_IMAGES[t]})`;
          div.textContent = "";
        } else {
          div.textContent=t;
        }
        if(selectable){
          div.addEventListener("click",()=>handleTileClick(idx));
          if(selectedIdx===idx) div.classList.add("selected");
        }
        container.appendChild(div);
      });
    }
    function formatPercent(x){ return Number.isFinite(x)?(x*100).toFixed(2)+"%":"0.00%"; }
    function updateStatsUI(){
      const {games,wins,tenpais,others,reward_sum,win_round_sum,win_type,tenpai_type}=stats;
      document.getElementById("gamesVal").textContent=games;
      document.getElementById("avgRewardVal").textContent=games?(reward_sum/games).toFixed(4):"0.0000";
      document.getElementById("avgWinRoundsVal").textContent=wins?(win_round_sum/wins).toFixed(2):"—";

      document.getElementById("tenpaiRatioVal").textContent=formatPercent(games?tenpais/games:0);
      document.getElementById("otherRatioVal").textContent=formatPercent(games?others/games:0);
      const wt=wins||1, tt=tenpais||1;
      document.getElementById("winTypesVal").textContent = wins===0?"—":`std ${(win_type.standard/wt*100).toFixed(1)}% | 7p ${(win_type.seven_pairs/wt*100).toFixed(1)}% | kok ${(win_type.kokushi/wt*100).toFixed(1)}%`;
      document.getElementById("tenpaiTypesVal").textContent = tenpais===0?"—":`std ${(tenpai_type.standard/tt*100).toFixed(1)}% | 7p ${(tenpai_type.seven_pairs/tt*100).toFixed(1)}% | kok ${(tenpai_type.kokushi/tt*100).toFixed(1)}%`;
    }
    function renderHistory(){
      const ul=document.getElementById("historyList");
      ul.innerHTML="";
      stats.history.slice().reverse().forEach(rec=>{
        const li=document.createElement("li");
        li.className="history-item";
        li.innerHTML = `<div>${new Date(rec.time).toLocaleString()} · ${rec.outcome.toUpperCase()} · ${rec.type} · r=${rec.reward.toFixed(2)} · rounds=${rec.rounds} · draws_left=${rec.draws_left}</div><div class="meta">steps=${rec.steps?.length||0}</div>`;
        ul.appendChild(li);
      });
    }
    function updateGameUI(){
      document.getElementById("drawsLeft").textContent=state.drawsLeft;
      document.getElementById("wallLeft").textContent=state.wall.length;
      document.getElementById("stepCount").textContent=state.stepCount;
      document.getElementById("statusLabel").textContent=state.inGame?"进行中":"未开始";
      renderTiles(document.getElementById("hand"), state.hand, true);
      renderTiles(document.getElementById("discards"), state.discards, false);
      document.getElementById("discardBtn").disabled = !(state.inGame && state.hand.length===14);
    }

    function resetSelection(){ selectedIdx=null; }
    let autoDiscard = false;
    function handleTileClick(idx){
      if(autoDiscard && state.inGame && state.hand.length===14){
        discardSelected(idx);
      }else{
        selectedIdx = selectedIdx===idx ? null : idx;
        updateGameUI();
      }
    }

    // --- 日志步骤 ---
    function logStep(action, tile){
      if (!currentSteps) return;
      currentSteps.push({
        action, tile,
        hand: [...state.hand],
        discards: [...state.discards],
        draws_left: state.drawsLeft,
        wall_left: state.wall.length,
        step: state.stepCount,
        can_win: canWin(state.hand),
      });
    }

    // --- 游戏流程 ---
    function startGame(){
      state.wall = buildWall();
      state.hand = [];
      state.discards = [];
      state.drawsLeft = MAX_DRAWS;
      state.stepCount = 0;
      state.inGame = true;
      currentSteps = [];
      resetSelection();
      for(let i=0;i<14;i++) drawTile(false);
      sortHand(state.hand);
      logStep("start", null);
      // 起手自摸判定
      checkWinAuto();
      saveGameState();
      updateGameUI();
    }

    function drawTile(decrement=true){
      if(state.wall.length===0) return null;
      const t=state.wall.pop();
      state.hand.push(t); // 新摸的牌放在最右侧，不自动插入排序
      if(decrement && state.drawsLeft>0) state.drawsLeft -= 1;
      return t;
    }

    function discardSelected(idxOverride=null){
      if(!state.inGame || state.hand.length!==14){ alert("需要在14张时打牌"); return; }
      const idx = idxOverride!==null ? idxOverride : selectedIdx;
      if(idx===null){ alert("请选择要打出的牌"); return; }
      const [tile]=state.hand.splice(idx,1);
      sortHand(state.hand); // 打出后自动整理，下一张新摸的仍放最右
      state.discards.push(tile);
      state.stepCount += 1;
      logStep("discard", tile);
      resetSelection();
      // 打出后，若无剩余摸牌或牌山空，则进入流局判定；否则自动摸牌并继续
      if(state.drawsLeft<=0 || state.wall.length===0){
        finishByExhaustion();
        return;
      }
      const drawn = drawTile(true);
      logStep("draw", drawn);
      checkWinAuto();
      saveGameState();
      updateGameUI();
    }

    function checkWinAuto(){
      if(state.hand.length===14 && canWin(state.hand)){
        finishGame("win", classifyWinType(state.hand));
      }
    }

    function tenpaiCompletionType(hand13){
      if(hand13.length!==13) return "other";
      for(const t of OUTPUT_TILES){
        const next = hand13.concat([t]);
        if(canWin(next)) return classifyWinType(next);
      }
      return "other";
    }

    function finishByExhaustion(){
      const outcome = isTenpai(state.hand) ? "tenpai" : "other";
      const type = outcome==="tenpai" ? tenpaiCompletionType(state.hand) : "other";
      finishGame(outcome, type);
    }

    function finishGame(outcome, type){
      if(!state.inGame) return;
      const draws_left = Math.max(0, state.drawsLeft);
      const reward = outcome==="win" ? 1.0 + 0.1 * draws_left : outcome==="tenpai" ? 0.1 : 0.0;
      const rounds = state.stepCount + 1;
      stats.games += 1;
      stats.reward_sum += reward;
      if(outcome==="win"){
        stats.wins += 1;
        stats.win_round_sum += rounds;
        if(stats.win_type[type]!==undefined) stats.win_type[type]+=1;
      }else if(outcome==="tenpai"){
        stats.tenpais += 1;
        if(stats.tenpai_type[type]!==undefined) stats.tenpai_type[type]+=1;
      }else{
        stats.others += 1;
      }
      stats.history.push({
        time: Date.now(),
        outcome, type, reward, rounds, draws_left,
        steps: currentSteps ? [...currentSteps] : [],
      });
      saveState(); renderHistory(); updateStatsUI();
      localStorage.removeItem(STORAGE_GAME_KEY);
      state.inGame=false;
      document.getElementById("statusLabel").textContent="已结束，自动开新局…";
      setTimeout(()=>{ startGame(); updateGameUI(); }, 600);
    }

    // --- 导入导出 ---
    function exportJSON(){ document.getElementById("ioArea").value=JSON.stringify(stats,null,2); }
    function importJSON(){
      try{
        const obj=JSON.parse(document.getElementById("ioArea").value);
        stats={...stats,...obj};
        saveState(); renderHistory(); updateStatsUI();
        alert("导入成功");
      }catch(e){ alert("导入失败: "+e.message); }
    }
    function clearAll(){
      if(!confirm("确认清空所有历史与统计？")) return;
      stats = {
        games:0,wins:0,tenpais:0,others:0,reward_sum:0,win_round_sum:0,
        win_type:{standard:0,seven_pairs:0,kokushi:0},
        tenpai_type:{standard:0,seven_pairs:0,kokushi:0},
        history:[],
      };
      saveState(); renderHistory(); updateStatsUI();
      localStorage.removeItem(STORAGE_GAME_KEY);
    }

    // --- 事件绑定 ---
    document.getElementById("discardBtn").onclick = () => discardSelected();
    document.getElementById("sortBtn").onclick = () => { sortHand(state.hand); saveGameState(); updateGameUI(); };
    document.getElementById("exportBtn").onclick = exportJSON;
    document.getElementById("importBtn").onclick = importJSON;
    document.getElementById("clearBtn").onclick = clearAll;
    document.getElementById("autoDiscardToggle").onchange = (e)=>{ autoDiscard = e.target.checked; saveGameState(); };
    document.body.addEventListener("contextmenu",(e)=>{
      e.preventDefault();
      if(state.inGame && state.hand.length===14){
        discardSelected(state.hand.length-1);
      }
    });

    // --- 初始化 ---
    loadState();
    renderHistory();
    updateStatsUI();
    const resumed = loadGameState();
    if(resumed){
      updateGameUI();
    }else{
      startGame();
      updateGameUI();
    }
  </script>
</body>
</html>
